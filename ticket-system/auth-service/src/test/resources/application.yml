spring:
  application:
    name: auth-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: testsecrettestsecrettestsecrettestsecret
  expiration: 86400000
