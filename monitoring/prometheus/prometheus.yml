global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-micrometer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8081', 'users-service:8082', 'events-service:8083', 'orders-service:8084', 'payments-service:8085', 'notifications-service:8086']
