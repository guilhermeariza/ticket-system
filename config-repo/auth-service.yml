server:
  port: 8081

spring:
  application:
    name: auth-service
  # Defaults below (user/password, JWT secret) are for local development only -
  # override via env vars in any shared or production environment. See .env.example.
  datasource:
    url: ${DB_URL:jdbc:postgresql://auth-db:5432/auth_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

# Default secret below is a development placeholder only - override via JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
