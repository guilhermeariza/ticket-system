server:
  port: 8083

spring:
  application:
    name: events-service
  # Defaults below (user/password) are for local development only -
  # override via env vars in any shared or production environment. See .env.example.
  datasource:
    url: ${DB_URL:jdbc:postgresql://eventos-db:5432/eventos_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
